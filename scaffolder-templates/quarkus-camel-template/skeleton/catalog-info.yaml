apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ${{values.component_id | dump}}
  {%- if values.description %}
  description: ${{values.description | dump}}
  {%- endif %}
  annotations:
    backstage.io/source-location: url:https://${{ values.host }}/${{ values.destination }}
    backstage.io/techdocs-ref: url:https://${{ values.host }}/${{ values.destination }}
    github.com/project-slug: ${{ values.destination }}
    argocd/app-name: ${{values.component_id}}
    backstage.io/kubernetes-id: ${{values.component_id}}
  tags:
    - java
    - quarkus
  links:
    - url: https://workspaces.openshift.com/#https://${{ values.host }}/${{ values.destination }}
      title: Openshift Dev Spaces (VS Code)
      icon: web
spec:
  type: service
  lifecycle: experimental
  owner: ${{values.owner | dump}}
  providedApis:
    - ${{values.component_id | dump}}
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: ${{values.component_id | dump}}
  {%- if values.description %}
  description: ${{values.description | dump}}
  {%- endif %}
  annotations:
    backstage.io/source-location: url:https://${{ values.host }}/${{ values.destination }}
    backstage.io/techdocs-ref: url:https://${{ values.host }}/${{ values.destination }}
    github.com/project-slug: ${{ values.destination }}
    argocd/app-name: ${{values.component_id}}-bootstrap
spec:
  type: openapi
  lifecycle: experimental
  owner: ${{values.owner | dump}}
  definition:
    $text: ./openapi.yaml