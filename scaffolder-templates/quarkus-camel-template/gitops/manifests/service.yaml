apiVersion: v1
kind: Service
metadata:
  name: ${{ values.component_id }}
  labels:
    app: ${{ values.component_id }}
    backstage.io/kubernetes-id: ${{ values.component_id }}
spec:
  type: ClusterIP
  selector:
    app: ${{ values.component_id }}
  ports:
    - port: 8080
      protocol: TCP
      name: http